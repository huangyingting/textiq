# Replaces the copied Squad CLI test glob (`test/*.test.cjs`) with TextIQ ops script tests.
name: Ops Script CI

on:
  pull_request:
    branches: [dev, preview, main, insider]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, insider]

permissions:
  contents: read

jobs:
  ops-scripts:
    name: Ops script tests (Node 22, SQLite)
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: sqlite
      DATABASE_URL: "file:./prisma/dev.db"
      AUTH_SECRET: ci-placeholder-secret-not-used-in-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ops script tests
        run: node --test scripts/ci-local.test.mjs scripts/dev-doctor.test.mjs scripts/production-install-smoke.test.mjs
