name: Deterministic E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  profile:
    name: Playwright deterministic profile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DB_PROVIDER: sqlite
      DATABASE_URL: "file:./prisma/dev.db"
      AUTH_SECRET: ci-placeholder-secret-not-used-in-production
      # The required profile performs 11 owner logins; production's limit is 10/minute.
      AUTH_LOGIN_RATE_LIMIT: "100"
      PORT: "4000"
      E2E_BASE_URL: http://127.0.0.1:4000
      AUTH_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:4000
      E2E_PROFILE: "1"
      E2E_PROFILE_GREP: "@required-profile"
      E2E_PROFILE_SERVER: dev
      E2E_WEB_SERVER: "1"
      E2E_WEB_SERVER_COMMAND: npm run dev
      E2E_WEB_SERVER_TIMEOUT_MS: "240000"
      E2E_REUSE_EXISTING_SERVER: "0"
      E2E_INSTALL_BROWSER_DEPS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic E2E profile
        run: npm run test:e2e:profile:self-contained
