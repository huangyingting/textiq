# Replaces the copied Squad docs-site deploy workflow. TextIQ keeps flat docs under docs/
# and does not have a docs/package.json or docs/dist site artifact.
name: Docs Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'e2e/ui-matrix/README.md'
      - '.github/workflows/squad-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'e2e/ui-matrix/README.md'
      - '.github/workflows/squad-docs.yml'

permissions:
  contents: read

jobs:
  docs-check:
    name: Docs check (root package)
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: sqlite
      DATABASE_URL: "file:./prisma/dev.db"
      AUTH_SECRET: ci-placeholder-secret-not-used-in-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check docs
        run: npm run docs:check
