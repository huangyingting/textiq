# Replaces the copied Squad CLI preview workflow with TextIQ's local quality gate.
name: Preview Quality Gate

on:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  validate:
    name: Preview quality gate (Node 22, SQLite)
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: sqlite
      DATABASE_URL: "file:./prisma/dev.db"
      AUTH_SECRET: ci-placeholder-secret-not-used-in-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local CI gate
        run: npm run ci:local
